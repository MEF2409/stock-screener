name: Deploy to Fly

on:
  push:
    branches: [main]
    paths:
      - "stock_screener/**"
      - "scripts/**"
      - ".streamlit/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - "fly.toml"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build on the GitHub runner (reliable PyPI) and push to Fly's registry.
      # --remote-only would defer the build to Fly/Depot's builder, which has
      # been hitting Connection-reset errors fetching from PyPI.
      - run: flyctl deploy --local-only --app "${{ secrets.FLY_APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
