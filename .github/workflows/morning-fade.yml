name: Morning Fade

on:
  schedule:
    # 9:45 AM ET = 13:45 UTC EDT, 14:45 UTC EST. Run both to cover both DST states.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  fade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Trigger morning fade on Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          MACHINE_ID=$(flyctl machine list --app "$FLY_APP_NAME" --json | jq -r '.[0].id')
          echo "Starting machine $MACHINE_ID..."
          flyctl machine start "$MACHINE_ID" --app "$FLY_APP_NAME" || true
          echo "Waiting 15s for machine to boot..."
          sleep 15
          flyctl ssh console --app "$FLY_APP_NAME" --command "python /app/scripts/morning_fade.py"
