[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener"
version = "0.1.0"
description = "Daily technical stock screener with Streamlit dashboard"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "streamlit>=1.32.0",
    "streamlit-aggrid>=1.0.0",
    "streamlit-authenticator>=0.4.0",
    "plotly>=5.20.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["stock_screener*"]
